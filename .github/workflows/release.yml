name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      prs_created: ${{ steps.release-please.outputs.prs_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release-please
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          skip-github-pull-request: false

  binaries:
    needs: process
    if: needs.process.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.process.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install

      - name: Build all platform binaries
        run: |
          mkdir -p release
          declare -A targets=(
            [clarity-darwin-arm64]=bun-darwin-arm64
            [clarity-darwin-x64]=bun-darwin-x64
            [clarity-linux-x64]=bun-linux-x64
            [clarity-linux-arm64]=bun-linux-arm64
            [clarity-windows-x64.exe]=bun-windows-x64
          )
          for name in "${!targets[@]}"; do
            bun build --compile --target="${targets[$name]}" ./src/cli/index.ts --outfile "release/$name"
          done

      - name: Generate checksums
        working-directory: release
        run: shasum -a 256 * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/*"

      - name: Upload binaries to the release release-please created
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.process.outputs.tag_name }}" release/*

  dispatch-publish:
    needs: process
    runs-on: ubuntu-latest
    if: needs.process.outputs.releases_created == 'true' || needs.process.outputs.prs_created == 'true'
    steps:
      - name: Dispatch publish for releases
        if: needs.process.outputs.releases_created == 'true'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-package
          client-payload: '{"tag": "latest"}'

      - name: Dispatch publish for prerelease
        if: needs.process.outputs.prs_created == 'true'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-package
          client-payload: '{"tag": "next"}'
